[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-trends-presentation"
version = "0.1.0"
description = "Streamlit presentation for the YouTube trends dashboard"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1",
    "pandas>=2.2,<4",
    "streamlit>=1.45,<2",
]

[tool.setuptools]
py-modules = ["app", "api_client"]