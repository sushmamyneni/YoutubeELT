[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-trends-business"
version = "0.1.0"
description = "Business services for discovering and analyzing YouTube channel trends"
requires-python = ">=3.10"
dependencies = [
	"fastapi>=0.115,<1",
	"requests>=2.32,<3",
	"uvicorn>=0.30,<1",
]

[tool.setuptools.packages.find]
where = ["src"]